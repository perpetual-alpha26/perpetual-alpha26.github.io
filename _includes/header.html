<header class="site-header" id="site-header">
    <div class="container header-content">
        <a href="{{ '/' | relative_url }}" class="logo" style="display: flex; align-items: center; gap: 12px;">
            <span class="logo-text">Perpetual <span class="highlight">Alpha</span></span>
            <img src="{{ '/assets/images/logo.png' | relative_url }}" alt="Logo" style="height: 35px; width: auto;">
        </a>
        <nav class="main-nav">
            <a href="{{ '/' | relative_url }}" class="{% if page.url == '/' or page.url == '/index.html' %}active{% endif %}">Home</a>
            <a href="{{ '/about' | relative_url }}" class="{% if page.url contains '/about' %}active{% endif %}">About</a>
            <a href="{{ '/schedule' | relative_url }}" class="{% if page.url contains '/schedule' %}active{% endif %}">Schedule</a>
            <a href="{{ '/register' | relative_url }}" class="{% if page.url contains '/register' %}active{% endif %}">Register</a>
            <a href="{{ '/committee' | relative_url }}" class="{% if page.url contains '/committee' %}active{% endif %}">Committee</a>
        </nav>
    </div>
</header>

<script>
    let lastScrollTop = 0;
    const header = document.getElementById("site-header");

    window.addEventListener("scroll", function() {
        let currentScroll = window.pageYOffset || document.documentElement.scrollTop;
        
        if (currentScroll > lastScrollTop && currentScroll > 80) {
            // Scrolling down
            header.classList.add("header-hidden");
        } else {
            // Scrolling up
            header.classList.remove("header-hidden");
        }
        lastScrollTop = currentScroll <= 0 ? 0 : currentScroll;
    }, false);
</script>
